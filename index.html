<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fala">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#15201B; --muted:#5B6862; --line:#D9DFDA;
  --mata:#0E5E4E; --mata-soft:#DCEDE7; --ipe:#F2B705; --ipe-ink:#2A2100;
  --roxo:#9B3C8C; --roxo-soft:#F5E4F1; --wave:#15201B; --wave-bg:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1814; --surface:#16231E; --ink:#E7EEEA; --muted:#9BACA4; --line:#2A3A33;
    --mata:#5CC8A8; --mata-soft:#1C3A30; --ipe:#F2B705; --ipe-ink:#2A2100;
    --roxo:#E591D7; --roxo-soft:#3A2235; --wave:#E7EEEA; --wave-bg:#0E1814;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1814; --surface:#16231E; --ink:#E7EEEA; --muted:#9BACA4; --line:#2A3A33;
  --mata:#5CC8A8; --mata-soft:#1C3A30; --ipe:#F2B705; --ipe-ink:#2A2100;
  --roxo:#E591D7; --roxo-soft:#3A2235; --wave:#E7EEEA; --wave-bg:#0E1814;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Familjen Grotesk","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:1.75rem;letter-spacing:-0.01em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.view{display:none}
.view.on{display:block}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}

/* buttons */
.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:700;background:var(--ipe);color:var(--ipe-ink);min-height:48px}
.btn.wide{width:100%}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.green{background:var(--mata);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.9rem}
.chip.on{border-color:var(--mata);background:var(--mata-soft)}
.icon{border:0;background:var(--mata-soft);color:var(--mata);width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.icon svg{width:22px;height:22px}
.link{border:0;background:none;color:var(--mata);font-weight:700;padding:6px 0}

/* hero */
.wave{display:block;width:100%;height:64px;border-radius:14px;background:var(--wave-bg)}
.count{margin-top:14px}
.count .num{font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:5.5rem;line-height:.9;letter-spacing:-0.04em}
.count .lbl{display:block;margin-top:6px;color:var(--muted)}
.phase{margin-top:18px;padding:14px 16px;border-left:4px solid var(--ipe);background:var(--surface);border-radius:0 12px 12px 0}
.phase h3{margin-bottom:4px}

/* lists */
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.tick.done{background:var(--mata);border-color:var(--mata);color:var(--surface)}
.tick svg{width:14px;height:14px}
.item .t{font-weight:700}
.item .s{font-size:.875rem;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mata);border-radius:4px}
.section-title{margin:26px 0 10px}

/* study card */
.studyhead{display:flex;gap:14px;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:12px}
.studyhead b{color:var(--ink)}
.card{background:var(--surface);border-radius:18px;padding:22px 18px;min-height:280px;display:flex;flex-direction:column;gap:16px}
.mode{font-size:.875rem;color:var(--muted)}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ipe);color:var(--ipe-ink);margin-left:6px;vertical-align:middle}
.prompt{font-size:1.5rem;line-height:1.3;font-family:"Familjen Grotesk",sans-serif;font-weight:500}
.prompt.hidden-text{color:var(--muted);font-size:1.1rem;font-family:inherit}
.answer{border-top:1px dashed var(--line);padding-top:14px}
.answer .pt{font-size:1.35rem;font-family:"Familjen Grotesk",sans-serif;font-weight:600;color:var(--mata)}
.answer .en{color:var(--muted);margin-top:4px}
.inputrow{display:flex;gap:8px;align-items:center}
.text{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:1.05rem}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:36px;height:36px;font-size:1rem}
.feedback{font-size:.95rem}
.feedback .miss{background:var(--roxo-soft);color:var(--roxo);border-radius:4px;padding:0 3px}
.feedback .hit{color:var(--mata)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate{border:0;border-radius:12px;padding:10px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.rate small{font-weight:400;font-size:.75rem;opacity:.85}
.r1{background:var(--roxo-soft);color:var(--roxo)}
.rate.sug{outline:3px solid var(--ipe);outline-offset:2px}
.r2{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.r3{background:var(--mata);color:var(--surface)}
.r4{background:var(--ipe);color:var(--ipe-ink)}
.listen{background:var(--surface);border-radius:18px;padding:26px 18px;text-align:center;min-height:320px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.listen .big{font-size:1.6rem;font-family:"Familjen Grotesk",sans-serif;font-weight:600}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;padding:4px;gap:4px;margin:14px 0 18px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--mata-soft);color:var(--mata)}

/* chat */
.scen{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.scen b{display:block;font-family:"Familjen Grotesk",sans-serif;font-size:1.1rem}
.msgs{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.msg{max-width:88%;padding:12px 14px;border-radius:16px}
.msg.bia{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--mata);color:var(--surface);align-self:flex-end;border-bottom-right-radius:4px}
.msg .tr{color:var(--muted);font-size:.9rem;margin-top:6px}
.msg .tools{display:flex;gap:14px;margin-top:6px}
.msg .tools button{border:0;background:none;color:var(--mata);font-size:.85rem;font-weight:700;padding:0}
.corr{align-self:flex-end;max-width:88%;background:var(--roxo-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-top:-6px}
.corr b{color:var(--roxo)}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0}
.typing{color:var(--muted);font-style:italic}

/* shadow */
.line{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:4px solid transparent}
.line.cur{border-left-color:var(--ipe)}
.line .en{color:var(--muted);font-size:.9rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 8px;font-size:1.4rem;font-family:"Familjen Grotesk",sans-serif;font-weight:600}
.pair button.right{border-color:var(--mata);background:var(--mata-soft)}
.pair button.wrong{border-color:var(--roxo);background:var(--roxo-soft)}

/* grammar */
.expl{background:var(--surface);border-radius:14px;padding:16px}
.expl p+p,.expl ul{margin-top:10px}
.expl ul{padding-left:20px;margin-bottom:0}
.expl em{color:var(--mata);font-style:normal;font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;font-size:1.05rem}
.opt.right{border-color:var(--mata);background:var(--mata-soft)}
.opt.wrong{border-color:var(--roxo);background:var(--roxo-soft)}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:14px}
.stat .v{font-family:"Familjen Grotesk",sans-serif;font-size:1.9rem;font-weight:700;line-height:1.1}
.stat .k{font-size:.85rem;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;background:var(--surface);border-radius:14px;padding:12px}
.chart div{flex:1;background:var(--mata);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.chart div.today{background:var(--ipe)}
.chart div.goal{background:var(--mata)}
.timeline{background:var(--surface);border-radius:14px;padding:6px 16px}
.tl{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .n{font-family:"Familjen Grotesk",sans-serif;font-weight:700;width:22px;color:var(--muted)}
.tl.now .n{color:var(--mata)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting select{font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px;max-width:55%}
textarea.text{width:100%;min-height:110px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
details{background:var(--surface);border-radius:14px;padding:14px 16px}
details summary{font-weight:700;cursor:pointer}
details ul{margin:10px 0 0;padding-left:20px}
details li+li{margin-top:6px}
.note{font-size:.875rem;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted);min-height:60px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--mata);font-weight:700}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px}
.rank{text-align:right;min-width:0}
.rank b{font-family:"Familjen Grotesk",sans-serif;font-size:1.05rem;display:block}
.rank .bar{width:140px;margin-left:auto;margin-top:6px}
.daybar{display:flex;justify-content:space-between;font-size:.9rem;margin:18px 0 6px}
.daybar b{font-family:"Familjen Grotesk",sans-serif}
.mission{background:var(--surface);border:2px solid var(--ipe);border-radius:18px;padding:18px;margin-top:16px}
.mission .k{font-size:.85rem;color:var(--muted)}
.mission .t{font-family:"Familjen Grotesk",sans-serif;font-size:1.45rem;font-weight:600;line-height:1.2;margin:2px 0 4px}
.xpchip{display:inline-block;background:var(--ipe);color:var(--ipe-ink);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700;flex:none}
.trail .item.cur{background:var(--mata-soft)}
.trail .lock{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);flex:none}
.combo{color:var(--roxo);font-weight:700}
.cele{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:24px}
.cele .box{background:var(--surface);border-radius:20px;padding:26px 22px;max-width:360px;width:100%;text-align:center;animation:pop .28s ease-out}
.cele .wave{height:36px;margin-bottom:16px}
.cele h2{font-size:1.6rem;margin-bottom:8px}
.zone{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-content:flex-start}
.zone.bank{border:0;justify-content:center;margin-top:12px}
.tile{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:1.05rem;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.tile.ghost{opacity:.25;pointer-events:none}
.bigpic{font-size:5.5rem;text-align:center;line-height:1.1;margin:6px 0}
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picopts button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-size:1.15rem;color:var(--ink)}
.picopts.emo button{font-size:3.2rem;padding:10px}
.picopts button.right{border-color:var(--mata);background:var(--mata-soft)}
.picopts button.wrong{border-color:var(--roxo);background:var(--roxo-soft)}
.fb{border-radius:14px;padding:14px;margin-top:14px}
.fb.ok{background:var(--mata-soft)}
.fb.bad{background:var(--roxo-soft)}
.fb b{font-family:"Familjen Grotesk",sans-serif;font-size:1.1rem}
.prhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.prhead .bar{flex:1;height:10px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-study"></section>
  <section class="view" id="v-speak"></section>
  <section class="view" id="v-grammar"></section>
  <section class="view" id="v-progress"></section>
</main>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12c3-4 6-4 9 0s6 4 9 0"/><path d="M3 18c3-4 6-4 9 0s6 4 9 0"/><path d="M3 6c3-4 6-4 9 0s6 4 9 0"/></svg>Hoje</button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="13" height="16" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg>Estudar</button>
  <button data-tab="speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Falar</button>
  <button data-tab="grammar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19 10 5l5 14M7 14h6M16 9h4M18 7v4"/></svg>Gramática</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"/></svg>Progresso</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<div id="celehost"></div>

{t:"Muletas para ganhar tempo",items:[["Então, é que…","So, the thing is…"],["Tipo assim…","Like…"],["Sabe? Tipo, não sei.","You know? Like, I don’t know."],["Aí ele falou que não vinha.","Then he said he wasn’t coming.","Então ele disse que não viria."],["Deixa eu ver…","Let me see…","Deixe-me ver."],["Como é que fala…","How do you say…"],["Na real, prefiro ficar em casa.","Honestly, I’d rather stay in.","Na verdade, eu prefiro ficar em casa."],["Enfim, deixa pra lá.","Anyway, never mind.","Enfim, esqueça."],["Ou seja, não vai dar.","Basically, it’s not happening.","Ou seja, não será possível."],["Mas assim, não é bem isso.","But like, that’s not quite it."]]},
{t:"Pedir sem soar robô",items:[["Me vê um café?","Can I get a coffee?","Eu gostaria de um café, por favor."],["Me dá uma água sem gás?","Can I have a still water?","Por favor, uma água sem gás."],["Dá pra trocar?","Can I swap it?","É possível trocar?"],["Cê pode me ajudar rapidinho?","Can you help me real quick?","Você poderia me ajudar?"],["Será que tem mesa pra dois?","Any chance of a table for two?","Há uma mesa para duas pessoas?"],["Queria a conta, por favor.","Could we get the bill, please?","Eu gostaria da conta."],["Tem como mandar por e-mail?","Any way you could email it?","Seria possível enviar por e-mail?"],["Me passa o sal?","Pass me the salt?","Você pode me passar o sal?"],["Me empresta seu carregador?","Can I borrow your charger?","Você pode me emprestar seu carregador?"],["Aceita cartão?","Do you take card?","Vocês aceitam cartão?"]]},
{t:"Diminutivos",items:[["Só um minutinho!","Just a sec!","Um momento, por favor."],["Vou ali rapidinho.","I’m just popping out.","Vou sair rapidamente."],["É pertinho daqui.","It’s really close.","É muito perto daqui."],["Bora tomar um cafezinho?","Fancy a quick coffee?","Vamos tomar um café?"],["Tá quentinho ainda.","It’s still nice and warm."],["Devagarinho!","Nice and slow!"],["Cadê o controle?","Where’s the remote?","Onde está o controle remoto?"],["Tô com uma fominha.","I’m a bit peckish.","Estou com um pouco de fome."],["Agorinha mesmo.","Just this second."],["Fica tranquilo, é rapidinho.","Don’t worry, it’s quick."]]},
{t:"Gírias do dia a dia",items:[["Beleza?","Alright?"],["Beleza, fechou!","Cool, deal!"],["De boa.","No worries."],["Tô de boa.","I’m chilling."],["Partiu praia!","Beach time!"],["Vai rolar uma festa sábado.","There’s a party happening Saturday.","Haverá uma festa no sábado."],["Cara, que viagem!","Mate, that’s mad!"],["Ele tava zoando.","He was messing about.","Ele estava brincando."],["Tamo junto!","I’ve got your back!"],["Falou, até mais!","Later!"],["Mano, sério?","Bro, seriously?"],["Tô nem aí.","I couldn’t care less."]]},
{t:"Pronomes de verdade",items:[["Te ligo mais tarde.","I’ll call you later.","Eu ligo para você mais tarde."],["Me ajuda aqui?","Give me a hand?","Você pode me ajudar?"],["Vi ele ontem.","I saw him yesterday.","Eu o vi ontem."],["Cê conhece ela?","Do you know her?","Você a conhece?"],["Me fala depois.","Tell me later.","Fale-me depois."],["Deixa comigo.","Leave it with me."],["Te espero lá fora.","I’ll wait for you outside.","Eu espero você lá fora."],["Já te falei!","I told you already!","Eu já lhe disse."],["Comprei, mas não usei ainda.","I bought it but haven’t used it yet.","Eu o comprei, mas ainda não o usei."],["Pega pra mim?","Grab it for me?","Você pode pegar para mim?"]]},
{t:"Tem (there is)",items:[["Tem farmácia aqui perto?","Is there a pharmacy nearby?","Há uma farmácia aqui perto?"],["Tinha muita gente lá.","There were loads of people there.","Havia muitas pessoas lá."],["Não tem problema.","No problem.","Não há problema."],["Tem que ser hoje?","Does it have to be today?"],["Tem como?","Is that doable?","É possível?"],["Tem alguém aí?","Anyone there?","Há alguém aí?"],["Faz tempo que não te vejo!","Long time no see!","Há muito tempo que não o vejo."],["Faz uns três anos.","About three years ago.","Há aproximadamente três anos."],["Não tem jeito.","Nothing you can do."],["Nada a ver.","That makes no sense / unrelated.","Isso não tem relação."],["Tem certeza?","Are you sure?"]]},
{t:"Futuro do jeito falado",items:[["Vou trabalhar amanhã.","I’m working tomorrow.","Eu trabalharei amanhã."],["Cê vai fazer o quê no fim de semana?","What are you up to this weekend?","O que você fará no fim de semana?"],["Vou pensar.","I’ll think about it.","Pensarei."],["Vai chover hoje.","It’s gonna rain today.","Choverá hoje."],["Amanhã eu te ligo.","I’ll call you tomorrow.","Ligarei para você amanhã."],["Sábado eu tô livre.","I’m free on Saturday.","Estarei livre no sábado."],["Vou dar uma olhada.","I’ll have a look."],["Vai dar certo.","It’ll work out."],["Já já eu chego.","I’ll be there any second."],["Depois a gente vê isso.","We’ll sort that later.","Veremos isso depois."]]},
{t:"Passado no papo",items:[["Cê viu o jogo ontem?","Did you watch the game last night?","Você assistiu ao jogo ontem?"],["Fui num barzinho com uns amigos.","I went to a little bar with some mates.","Fui a um bar com alguns amigos."],["Já comeu?","Have you eaten?","Você já comeu?"],["Ainda não terminei.","I haven’t finished yet."],["Ela me ligou ontem à noite.","She called me last night."],["Esqueci a carteira em casa.","I left my wallet at home."],["Curtiu o filme?","Did you enjoy the film?","Você gostou do filme?"],["Choveu o dia inteiro.","It rained all day."],["Nem vi a hora passar.","I totally lost track of time.","Não percebi o tempo passar."],["Dormi supermal.","I slept terribly.","Dormi muito mal."]]},
{t:"Como era",items:[["Quando eu era criança, jogava bola todo dia.","As a kid, I played football every day.","Quando eu era criança, eu jogava futebol todos os dias."],["Tava dormindo quando cê ligou.","I was asleep when you called.","Eu estava dormindo quando você ligou."],["Eu morava com meus pais.","I used to live with my parents."],["Tava um frio absurdo.","It was ridiculously cold.","Fazia muito frio."],["Eu queria te perguntar uma coisa.","I wanted to ask you something."],["A gente sempre ia pra praia no verão.","We always went to the beach in summer.","Nós sempre íamos à praia no verão."],["Nem sabia disso.","I had no idea.","Eu não sabia disso."],["Eu achava que era mais fácil.","I thought it’d be easier."],["Cê tava fazendo o quê?","What were you up to?","O que você estava fazendo?"],["Antigamente era diferente.","It used to be different."]]},
{t:"Opinião sem robô",items:[["Pra mim, vale a pena.","For me, it’s worth it.","Na minha opinião, vale a pena."],["Concordo total.","Totally agree.","Concordo plenamente com você."],["Sei lá, depende.","Dunno, depends."],["Não tenho certeza, não.","I’m not so sure."],["Achei meio caro.","I thought it was a bit pricey.","Achei um pouco caro."],["Foi bom, mas nada demais.","It was good, but nothing special."],["Não curti muito.","I wasn’t really a fan.","Eu não gostei muito."],["É uma boa, hein!","Good shout!"],["Tô em dúvida.","I’m in two minds."],["Pior que é verdade.","Annoyingly, that’s true."]]},

{t:"Padaria e boteco",items:[["Me vê um pão de queijo e um pingado?","Can I get a cheese bread and a coffee with a dash of milk?"],["O que cê recomenda?","What do you recommend?","O que você recomenda?"],["Tava uma delícia!","That was delicious!","Estava delicioso."],["Pode ser sem cebola?","Can you do it without onion?"],["Vou de prato feito.","I’ll go for the set plate.","Eu vou querer o prato feito."],["Desce mais uma?","Another round?"],["Essa é a saideira!","This is the last one!"],["Bora rachar a conta?","Shall we split the bill?","Vamos dividir a conta?"],["Tá trincando de gelada!","It’s ice cold!"],["Tem opção vegetariana?","Any veggie options?"]]},
{t:"Trampo",items:[["Trabalho com dados do mercado imobiliário.","I work with property market data.","Eu trabalho com dados do mercado imobiliário."],["Os imóveis subiram muito.","Property prices have shot up.","Os preços dos imóveis subiram muito."],["Tô atolado de trabalho.","I’m swamped.","Estou com muito trabalho."],["Me manda o relatório?","Can you send me the report?","Você pode me enviar o relatório?"],["Vou dar uma olhada nos números e te aviso.","I’ll look at the numbers and let you know."],["Qual é o prazo?","What’s the deadline?"],["Bora marcar uma call?","Shall we set up a call?","Vamos agendar uma reunião?"],["Tô migrando pra área de IA.","I’m moving into AI.","Estou mudando de carreira para inteligência artificial."],["Hoje foi puxado.","Today was rough.","Hoje foi um dia difícil."],["Sextou!","Friday at last!"]]},
{t:"Academia e boxe",items:[["Bora treinar!","Let’s train!"],["Mais uma! Cê consegue!","One more! You’ve got this!","Mais uma! Você consegue!"],["Segura a postura.","Hold your posture."],["Respira, respira!","Breathe, breathe!"],["Hoje é dia de perna.","It’s leg day."],["Tô todo dolorido.","I’m sore all over.","Estou muito dolorido."],["Treino boxe faz uns anos.","I’ve been boxing for a few years.","Eu treino boxe há alguns anos."],["Guarda alta!","Hands up!"],["Solta o jab!","Throw the jab!"],["Mandou bem!","Nice one!","Muito bem!"]]},
{t:"Rolê e planos",items:[["Bora tomar uma?","Fancy a drink?","Vamos tomar uma cerveja?"],["Cê tá livre sábado?","You free Saturday?","Você está livre no sábado?"],["Que tal amanhã à noite?","How about tomorrow night?"],["Me chama no zap.","Hit me up on WhatsApp.","Mande-me uma mensagem no WhatsApp."],["Foi mal, vou atrasar um pouquinho.","Sorry, I’ll be a bit late.","Desculpe, vou me atrasar."],["Combinado!","Deal!"],["Fechou, sábado então.","Sorted, Saturday then."],["Hoje não vai dar.","Can’t make it today.","Hoje não poderei."],["Fica pra próxima.","Next time, then."],["Cola aqui em casa!","Come round mine!","Venha à minha casa."]]},

{t:"Tomara que…",items:[["Espero que cê goste.","Hope you like it.","Espero que você goste."],["Tomara que não chova!","Fingers crossed it doesn’t rain!"],["Talvez eu vá.","I might go."],["Quero que cê venha.","I want you to come.","Quero que você venha."],["Não acho que seja uma boa.","I don’t reckon that’s a good idea.","Não acho que seja uma boa ideia."],["Antes que eu esqueça…","Before I forget…"],["Duvido que ele saiba.","I doubt he knows."],["Caso precise, me liga.","If you need anything, call me.","Caso você precise, ligue-me."],["Tomara que dê certo.","Hope it works out."],["Fala devagar pra eu entender.","Speak slowly so I can follow.","Fale devagar para que eu entenda."]]},
{t:"Se e quando",items:[["Se der, eu vou.","If I can, I’ll go.","Se for possível, eu irei."],["Quando cê chegar, me avisa.","Let me know when you get here.","Quando você chegar, avise-me."],["Se cê quiser, te ajudo.","If you want, I’ll help.","Se você quiser, eu ajudo você."],["Quando eu for pro Brasil, quero ir pra Bahia.","When I go to Brazil, I want to go to Bahia.","Quando eu for ao Brasil, quero ir à Bahia."],["Assim que puder, te respondo.","I’ll reply as soon as I can."],["Faz o que cê achar melhor.","Do whatever you think’s best.","Faça o que você achar melhor."],["Se Deus quiser!","God willing!"],["Se eu fosse você, aceitava.","If I were you, I’d take it.","Se eu fosse você, eu aceitaria."],["Se eu soubesse, tinha te falado.","If I’d known, I’d have told you.","Se eu soubesse, teria lhe dito."],["Eu ia, mas tô sem tempo.","I’d go, but I’m short on time.","Eu iria, mas não tenho tempo."]]},
{t:"Viagem",items:[["Quero muito conhecer o Nordeste.","I really want to see the Northeast."],["Que horas é o check-in?","What time’s check-in?","A partir de que horas é o check-in?"],["Cês têm wi-fi?","You guys got wi-fi?","Vocês têm wi-fi?"],["Essa área é tranquila à noite?","Is this area OK at night?","Essa região é segura à noite?"],["Perdi o voo, acredita?","I missed my flight, can you believe it?"],["Tenho reserva no nome de Ezra.","I’ve got a booking under Ezra.","Tenho uma reserva em nome de Ezra."],["Qual praia cê indica?","Which beach would you recommend?","Que praia você recomenda?"],["Tô amando o Brasil!","I’m loving Brazil!","Estou adorando o Brasil."],["Quanto dá até o centro?","How much to the centre?"],["Pode me deixar aqui mesmo.","You can drop me right here."]]},
{t:"Sobreviver na conversa",items:[["Peraí, deixa eu pensar…","Hang on, let me think…","Espere, deixe-me pensar."],["Como fala “deadline” em português?","How do you say “deadline” in Portuguese?","Como se diz “deadline” em português?"],["Que que é isso?","What’s that?","O que é isso?"],["Entendo mais do que falo.","I understand more than I speak."],["Pode me corrigir, tá?","Feel free to correct me, OK?"],["Tô aprendendo faz poucos meses.","I’ve only been learning a few months.","Estou aprendendo há poucos meses."],["Tem um jeito mais natural de falar isso?","Is there a more natural way to say that?"],["Me deu um branco.","My mind’s gone blank."],["Como assim?","What do you mean?","O que você quer dizer?"],["Repete? Não peguei.","Say again? Didn’t catch that.","Pode repetir? Não entendi."]]}

const RUA=[
{id:"rua-contracoes",rua:true,t:"Fala de rua: cê, tá, pra, né",ex:`<p>Spoken Brazilian squashes the most common words. These aren’t slang or lazy speech; they’re how almost everyone talks, including on TV. Full forms are for emails and formal writing.</p><ul><li>você → <em>cê</em>, está → <em>tá</em>, estou → <em>tô</em>, estava → <em>tava</em></li><li>para → <em>pra</em>, para o → <em>pro</em>, vamos → <em>vamo</em> or <em>bora</em></li><li>não é? → <em>né?</em> (the tag on half of all sentences)</li><li>espera aí → <em>peraí</em>, onde está → <em>cadê</em></li></ul>`,d:[["Most natural way to say “Você está bem?”",["Cê tá bem?","Você está bem?","Tu estás bem?"],0,"You OK?"],["Most natural: “Eu estou chegando.”",["Estou a chegar.","Tô chegando.","Eu chego."],1,"I’m nearly there."],["Most natural: “Vamos para o bar?”",["Vamo pro bar?","Vamos ao bar?","Iremos ao bar?"],0,"Shall we go to the bar?"],["Most natural: “Eu estava dormindo.”",["Eu estive dormindo.","Tava dormindo.","Eu dormia-me."],1,"I was asleep."],["“Tá quente, ___?” (isn’t it?)",["né","não","sim"],0,"It’s hot, isn’t it?"],["Most natural: “Onde está meu celular?”",["Cadê meu celular?","Onde está o meu telemóvel?","Meu celular, onde ele está?"],0,"Where’s my phone?"]]},
{id:"rua-gramatica",rua:true,t:"Fala de rua: a gente, tem, me ajuda",ex:`<p>Five grammar habits that instantly make you sound Brazilian rather than textbook:</p><ul><li><em>a gente</em> + singular verb for “we”: a gente <em>vai</em>, not nós vamos.</li><li><em>tem</em> for “there is”: <em>tem</em> festa hoje, not há.</li><li>Pronoun first, even to start a sentence: <em>Me</em> ajuda? <em>Te</em> ligo depois.</li><li><em>ele/ela</em> as the object: vi <em>ele</em>, not eu o vi.</li><li>Drop the object and subject when obvious: — Comprou o ingresso? — <em>Comprei.</em></li></ul>`,d:[["Most natural: “We’re going to the beach.”",["Nós iremos à praia.","A gente vai pra praia.","A gente vamos pra praia."],1,""],["Most natural: “There’s a party today.”",["Há uma festa hoje.","Tem festa hoje.","Existe uma festa hoje."],1,""],["Most natural: “Help me here?”",["Ajude-me aqui?","Me ajuda aqui?","Ajuda-me aqui?"],1,""],["Most natural: “I saw him yesterday.”",["Eu o vi ontem.","Vi ele ontem.","Eu vi-o ontem."],1,""],["“Cê comprou o ingresso?” Most natural “Yes, I did”:",["Sim, eu o comprei.","Comprei, sim.","Sim, comprei-o."],1,"Did you buy the ticket? Yeah, I did."],["Most natural: “We were talking about you.”",["Nós estávamos a falar de ti.","A gente tava falando de você.","Nós falávamos sobre você."],1,""]]},
{id:"rua-reagir",rua:true,t:"Fala de rua: responder e reagir",ex:`<p>Brazilians rarely answer with a bare <em>sim</em>. They repeat the verb: — Quer? — <em>Quero.</em> — Tem? — <em>Tenho, sim.</em> A double negative softens a no: <em>Sei não</em>, <em>Não tenho, não</em>.</p><p>Conversation is full of reactions. Use them constantly, or you’ll seem cold:</p><ul><li><em>Nossa!</em> wow, <em>Sério? / Jura?</em> really?, <em>Mentira!</em> no way!</li><li><em>Pois é</em> I know, right; <em>É mesmo?</em> oh really?; <em>Uhum</em> yeah</li><li><em>Putz</em> ugh, <em>Que massa!</em> awesome, <em>Que isso!</em> come on!</li><li><em>Imagina</em> = don’t mention it (better than de nada with friends)</li></ul>`,d:[["“Cê quer um café?” Most natural “Yes”:",["Sim.","Quero, sim.","Afirmativo."],1,"Want a coffee? Yes please."],["“Cê tem irmão?” Most natural “No”:",["Não tenho, não.","Negativo.","Não possuo."],0,"Got any brothers? No, I don’t."],["Friend: “Fui promovido!” You react:",["Nossa, que massa! Parabéns!","Interessante.","Sim, eu entendo."],0,"I got promoted! Wow, amazing! Congrats!"],["Friend: “Perdi o voo ontem.” You react:",["Que bom!","Putz, sério?","Pois é."],1,"I missed my flight yesterday. Ugh, seriously?"],["Someone thanks you for a favour. Reply:",["Imagina!","Obrigado também.","Por nada, senhor."],0,"Don’t mention it!"],["Friend: “Esse trânsito tá um inferno.” You agree:",["Pois é, né?","Concordo com sua afirmação.","Que massa!"],0,"This traffic is hell. I know, right?"]]},
{id:"rua-muletas",rua:true,t:"Fala de rua: muletas, pedidos e -inho",ex:`<p><em>Fillers</em> buy you thinking time and make you sound fluent even while you search for words: então, tipo, tipo assim, aí, sabe?, é que, na real, enfim, peraí, deixa eu pensar.</p><p><em>Requests</em> among normal people: <em>Me vê</em> um café? <em>Me dá</em>…? <em>Dá pra</em>…? <em>Tem como</em>…? <em>Será que</em>…? “Você poderia, por favor” is polite but stiff with friends or at a padaria.</p><p><em>Diminutives</em> soften and sound friendly: rapidinho, um minutinho, pertinho, cafezinho.</p>`,d:[["Ordering at a padaria:",["Eu desejo um café.","Me vê um café?","Dê-me um café."],1,"Can I get a coffee?"],["Asking a friend: “Can you help me quickly?”",["Cê pode me ajudar rapidinho?","Poderia o senhor ajudar-me?","Ajuda-me rapidamente."],0,""],["You need a second to think. Say:",["Aguarde.","Peraí, deixa eu pensar…","Um momento enquanto penso."],1,"Hang on, let me think…"],["Most natural: “Any way to send it today?”",["Tem como mandar hoje?","É possível enviar hoje?","Existe a possibilidade de envio hoje?"],0,""],["“Just a sec!”",["Só um minutinho!","Um minuto exato!","Aguarde um momento."],0,""],["Telling a story: “Then he said…”",["Aí ele falou…","Destarte ele disse…","Posteriormente ele disse…"],0,""]]},
{id:"rua-girias",rua:true,t:"Fala de rua: gírias essenciais",ex:`<p>Safe, everyday slang you’ll hear constantly, mostly São Paulo flavoured:</p><ul><li><em>beleza / blz</em> alright, <em>de boa</em> chill, <em>fechou</em> deal</li><li><em>cara / mano</em> mate / bro, <em>galera</em> everyone</li><li><em>rolar</em> to happen (vai rolar festa), <em>zoar</em> to mess about</li><li><em>partiu</em> let’s go to…, <em>sextou</em> it’s Friday, <em>tamo junto</em> got your back</li><li><em>trampo</em> work, <em>mó</em> really (mó legal), <em>falou</em> later</li></ul><p>Regional: Rio says <em>mermão</em> and <em>bolado</em>; the Northeast says <em>oxe</em> and <em>massa</em>.</p>`,d:[["“Cool, deal!”",["Beleza, fechou!","Muito bem, acordado!","Ok, contrato!"],0,""],["“There’s a party happening Saturday.”",["Vai rolar uma festa sábado.","Haverá uma festa no sábado.","Vai ter festejo sábado."],0,""],["Your sparring partner lands a clean combo. Say:",["Mandou bem!","Fez corretamente!","Bom trabalho realizado!"],0,"Nice one!"],["Saying bye casually:",["Falou, até mais!","Adeus.","Passar bem."],0,"Later!"],["“I’m chilling.”",["Tô de boa.","Estou relaxando-me.","Estou tranquilizado."],0,""],["In São Paulo, “Vou pro trampo” means:",["I’m off to work","I’m getting the tram","I’m in trouble"],0,""]]}
];

const GRAMMAR=RUA.concat([
{id:"ser-estar",t:"Ser vs estar",ex:`<p><em>Ser</em> is for what something <i>is</i>: identity, job, origin, characteristics, time, events. <em>Estar</em> is for how or where something is right now: feelings, conditions, location of people and things.</p><ul><li>Eu <em>sou</em> de Londres. (origin)</li><li>Eu <em>estou</em> cansado. (current state)</li><li>A festa <em>é</em> no sábado. (events use ser)</li></ul><p>Present forms: sou, é, somos, são / estou, está, estamos, estão. In speech, <em>estou</em> becomes <em>tô</em> and <em>está</em> becomes <em>tá</em>.</p>`,d:[["Eu ___ inglês.",["sou","estou","é"],0,"I’m English."],["Hoje eu ___ cansado.",["sou","estou","está"],1,"I’m tired today."],["A festa ___ no sábado.",["é","está","são"],0,"The party is on Saturday."],["O restaurante ___ fechado agora.",["é","está","são"],1,"The restaurant is closed now."],["Ela ___ médica.",["está","é","estou"],1,"She’s a doctor."],["Nós ___ atrasados.",["somos","estamos","são"],1,"We’re late."]]},
{id:"presente",t:"Present tense",ex:`<p>Drop -ar/-er/-ir and add the ending. Brazilians mostly use <em>você</em> (you) and <em>a gente</em> (we), which both take the same form as ele/ela, so you only need four forms day to day.</p><ul><li>falar: eu fal<em>o</em>, você/ele/a gente fal<em>a</em>, nós fal<em>amos</em>, eles fal<em>am</em></li><li>comer: com<em>o</em>, com<em>e</em>, com<em>emos</em>, com<em>em</em></li><li>abrir: abr<em>o</em>, abr<em>e</em>, abr<em>imos</em>, abr<em>em</em></li></ul>`,d:[["Eu ___ português todo dia.",["estudo","estuda","estudamos"],0,"I study Portuguese every day."],["Você ___ onde?",["moro","mora","moram"],1,"Where do you live?"],["A gente ___ pizza às sextas.",["come","comemos","comem"],0,"We eat pizza on Fridays."],["Eles ___ muito.",["trabalha","trabalho","trabalham"],2,"They work a lot."],["Nós ___ a loja cedo.",["abrimos","abre","abrem"],0,"We open the shop early."],["Ele não ___ carne.",["como","come","comem"],1,"He doesn’t eat meat."]]},
{id:"irregulares",t:"Key irregular verbs",ex:`<p>The verbs you’ll use most are irregular. Learn them as chunks.</p><ul><li>ter: tenho, tem, temos, têm</li><li>ir: vou, vai, vamos, vão</li><li>fazer: faço, faz, fazemos, fazem</li><li>poder: posso, pode, podemos, podem</li><li>querer: quero, quer, queremos, querem</li><li>ver: vejo, vê, vemos, veem</li></ul>`,d:[["Eu ___ dois irmãos.",["tem","tenho","temos"],1,"I have two brothers."],["Você ___ me ajudar?",["posso","pode","podem"],1,"Can you help me?"],["Eu ___ ao mercado agora.",["vai","vou","vamos"],1,"I’m going to the shop now."],["O que você ___ no fim de semana?",["faço","faz","fazem"],1,"What do you do at the weekend?"],["Eles ___ sair.",["quer","querem","quero"],1,"They want to go out."],["Eu não ___ nada.",["vejo","vê","vemos"],0,"I can’t see anything."]]},
{id:"contracoes",t:"Contractions: no, na, do, da, pelo",ex:`<p>Prepositions merge with articles. This happens in almost every sentence.</p><ul><li>em + o/a = <em>no / na</em> (in/on the)</li><li>de + o/a = <em>do / da</em> (of/from the)</li><li>por + o/a = <em>pelo / pela</em> (through/by the)</li><li>a + a = <em>à</em> (to the)</li></ul><p>Most city names take no article: <em>em</em> Londres, <em>de</em> São Paulo. Countries usually do: <em>no</em> Brasil, <em>da</em> Inglaterra.</p>`,d:[["Eu moro ___ Londres.",["em","no","na"],0,"I live in London."],["Ele está ___ escritório.",["na","no","em o"],1,"He’s at the office."],["Esse livro é ___ Maria.",["do","de a","da"],2,"This book is Maria’s."],["Ela é ___ Brasil.",["de","do","da"],1,"She’s from Brazil."],["Passei ___ centro.",["pelo","pela","no"],0,"I went through the centre."],["O celular está ___ mesa.",["no","na","da"],1,"The phone is on the table."]]},
{id:"gerundio",t:"Estar + -ndo and ir + infinitive",ex:`<p><em>Estar + gerund</em> is what’s happening now: estou trabalha<em>ndo</em>, está come<em>ndo</em>, estamos dormi<em>ndo</em>.</p><p><em>Ir + infinitive</em> is the everyday future. Brazilians rarely use the formal future tense in speech: vou <em>viajar</em>, vai <em>chover</em>.</p>`,d:[["Agora eu ___ trabalhando.",["sou","estou","vou"],1,"I’m working now."],["O que você está ___?",["fazer","fazendo","faz"],1,"What are you doing?"],["Amanhã eu ___ viajar.",["estou","vou","vai"],1,"Tomorrow I’m going to travel."],["A gente vai ___ mais tarde.",["comer","comendo","come"],0,"We’re going to eat later."],["Ela está ___ no telefone.",["falar","falando","fala"],1,"She’s on the phone."],["Vai ___ hoje?",["chover","chovendo","chove"],0,"Is it going to rain today?"]]},
{id:"perfeito",t:"Past: pretérito perfeito",ex:`<p>Finished actions at a specific moment.</p><ul><li>falar: fal<em>ei</em>, fal<em>ou</em>, fal<em>amos</em>, fal<em>aram</em></li><li>comer: com<em>i</em>, com<em>eu</em>, com<em>emos</em>, com<em>eram</em></li><li>sair: sa<em>í</em>, sa<em>iu</em>, sa<em>ímos</em>, sa<em>íram</em></li></ul><p>Must-know irregulars: fui (I went / I was), fez, tive, disse, vi, pude. <em>Ir</em> and <em>ser</em> share the same past forms.</p>`,d:[["Ontem eu ___ muito.",["trabalho","trabalhei","trabalhava"],1,"I worked a lot yesterday."],["Você ___ o filme?",["viu","vê","vi"],0,"Did you see the film?"],["A gente ___ cedo.",["saiu","saímos","saíram"],0,"We left early."],["Eles ___ tudo.",["comeu","comeram","comemos"],1,"They ate everything."],["Eu ___ ao Brasil em 2019.",["vou","fui","ia"],1,"I went to Brazil in 2019."],["Ela ___ que não vinha.",["disse","dizia","diz"],0,"She said she wasn’t coming."]]},
{id:"imperfeito",t:"Imperfeito vs perfeito",ex:`<p><em>Imperfeito</em> sets the scene: habits (used to), background, ongoing states. <em>Perfeito</em> moves the story: single completed events.</p><ul><li>-ar: fal<em>ava</em>, fal<em>ava</em>, fal<em>ávamos</em>, fal<em>avam</em></li><li>-er/-ir: com<em>ia</em>, com<em>ia</em>, com<em>íamos</em>, com<em>iam</em></li><li>Irregular: era (ser), tinha (ter), ia (ir), estava</li></ul><p>Eu <em>estava</em> dormindo (scene) quando você <em>ligou</em> (event).</p>`,d:[["Quando eu era criança, eu ___ muito.",["brinquei","brincava","brinco"],1,"When I was a kid, I used to play a lot."],["Eu ___ dormindo quando ele ligou.",["estive","estava","estou"],1,"I was sleeping when he called."],["Ontem eu ___ às sete.",["acordei","acordava","acordo"],0,"Yesterday I woke up at seven."],["Antigamente a gente ___ à praia todo verão.",["foi","ia","vai"],1,"We used to go to the beach every summer."],["Ele ___ cansado, então foi embora.",["esteve","estava","está"],1,"He was tired, so he left."],["De repente, o telefone ___.",["tocava","tocou","toca"],1,"Suddenly, the phone rang."]]},
{id:"pronomes",t:"Object pronouns, Brazilian style",ex:`<p>Spoken Brazilian Portuguese puts object pronouns <em>before</em> the verb, even at the start of a sentence: <em>Me</em> ajuda? <em>Te</em> ligo amanhã.</p><p>For “him/her/them”, speech uses <em>ele, ela, eles</em> after the verb: Eu vi <em>ele</em>. Textbooks teach <em>o/a</em> (eu o vi), which you’ll see in writing.</p><p><em>Te</em> is used as the object form for você in casual speech.</p>`,d:[["Eu ___ ligo amanhã.",["te","você","lhe"],0,"I’ll call you tomorrow."],["Eu vi ___ no parque. (him)",["lhe","ele","se"],1,"I saw him in the park."],["___ passa o sal?",["Me","Mim","Eu"],0,"Can you pass me the salt?"],["Ela ___ conhece. (me)",["mim","me","eu"],1,"She knows me."],["Você pode ___ ajudar?",["me","mim","eu"],0,"Can you help me?"],["Eu já ___ disse isso.",["você","te","tu"],1,"I already told you that."]]},
{id:"por-para",t:"Por vs para",ex:`<p><em>Para</em> (spoken <em>pra</em>) points to a goal: destination, purpose, recipient, deadline. <em>Por</em> is about the path or cause: through, by, for (in exchange), because of, per.</p><ul><li>Esse presente é <em>para</em> você. Estudo <em>para</em> falar melhor.</li><li>Obrigado <em>por</em> tudo. Paguei 50 reais <em>por</em> isso. Passei <em>pela</em> praia.</li></ul>`,d:[["Obrigado ___ tudo.",["por","para","pra"],0,"Thanks for everything."],["Esse presente é ___ você.",["por","para","pelo"],1,"This present is for you."],["Eu vou ___ o Brasil em janeiro.",["por","pelo","para"],2,"I’m going to Brazil in January."],["Passamos ___ praia.",["para a","pela","pelo"],1,"We went past the beach."],["Estudo ___ falar melhor.",["por","para","pela"],1,"I study to speak better."],["Paguei cinquenta reais ___ isso.",["por","para","pra"],0,"I paid fifty reais for this."]]},
{id:"comparacoes",t:"Comparisons",ex:`<p><em>mais … (do) que</em> = more … than; <em>menos … (do) que</em> = less … than; <em>tão … quanto</em> = as … as.</p><p>Irregulars: bom → <em>melhor</em>, ruim → <em>pior</em>, grande → <em>maior</em>, pequeno → <em>menor</em>. Superlative: o melhor restaurante <em>da</em> cidade.</p>`,d:[["Esse é ___ que aquele. (better)",["mais bom","melhor","bem"],1,"This one is better than that one."],["Hoje está ___ que ontem. (worse)",["pior","mais ruim","mal"],0,"Today is worse than yesterday."],["Ele é tão alto ___ eu.",["que","como","quanto"],2,"He’s as tall as me."],["São Paulo é ___ que Londres.",["mais grande","maior","grandíssimo"],1,"São Paulo is bigger than London."],["É o melhor bar ___ cidade.",["na","da","de"],1,"It’s the best bar in the city."],["Português é mais fácil ___ eu pensava.",["do que","como","de"],0,"Portuguese is easier than I thought."]]},
{id:"subjuntivo",t:"Present subjunctive",ex:`<p>Used after wishes, doubts, emotions and some conjunctions: espero que, quero que, talvez, tomara que, é importante que, duvido que, para que, antes que, caso.</p><p>Take the eu form of the present, drop -o, and swap the vowel: fal<em>o</em> → fal<em>e</em>; com<em>o</em> → com<em>a</em>; tenh<em>o</em> → tenh<em>a</em>.</p><p>Irregulars: seja (ser), esteja (estar), vá (ir), saiba (saber), queira (querer), dê (dar), faça (fazer).</p>`,d:[["Espero que você ___ bem.",["está","esteja","estar"],1,"I hope you’re well."],["Quero que ele ___.",["vem","venha","vir"],1,"I want him to come."],["Talvez a gente ___ amanhã.",["vai","vá","ir"],1,"Maybe we’ll go tomorrow."],["Tomara que ___ sol!",["faz","faça","fazer"],1,"Let’s hope it’s sunny!"],["É importante que você ___ todo dia.",["pratica","pratique","praticar"],1,"It’s important that you practise every day."],["Duvido que ela ___.",["sabe","saiba","saber"],1,"I doubt she knows."]]},
{id:"futuro-subj",t:"Se and quando: future subjunctive",ex:`<p>After <em>se</em> (if), <em>quando</em> (when), <em>assim que</em> (as soon as) and <em>enquanto</em> (while) about the future, Portuguese uses the future subjunctive. It sounds advanced but you need it daily.</p><p>Take the eles form of the past (fala<em>ram</em>, tive<em>ram</em>, fo<em>ram</em>), drop -am: falar, tiver, for. Others: puder, quiser, der, fizer, estiver, souber.</p><p><em>Se eu tiver tempo, eu vou.</em> If I have time, I’ll go.</p>`,d:[["Se eu ___ tempo, eu vou.",["tenho","tiver","tivesse"],1,"If I have time, I’ll go."],["Quando você ___, me liga.",["chega","chegar","chegue"],1,"When you arrive, call me."],["Se você ___, a gente sai.",["quer","quiser","queira"],1,"If you want, we’ll go out."],["Assim que eu ___, te respondo.",["posso","puder","possa"],1,"As soon as I can, I’ll reply."],["Quando eu ___ ao Brasil, vou para a Bahia.",["vou","for","vá"],1,"When I go to Brazil, I’ll go to Bahia."],["Se ___ certo, ótimo.",["dá","der","dê"],1,"If it works out, great."]]},
{id:"condicional",t:"Hypotheticals: would and if I were",ex:`<p><em>Conditional</em> (would): infinitive + -ia: falar<em>ia</em>, gostar<em>ia</em>, poder<em>ia</em>. Irregular: faria, diria, traria. In speech, the imperfeito often replaces it: <em>eu ia</em> = I would go.</p><p><em>Imperfect subjunctive</em> (if I were / had): take the eles past, drop -ram, add -sse: fosse, tivesse, soubesse, pudesse.</p><p><em>Se eu fosse você, eu aceitaria.</em></p>`,d:[["Se eu ___ rico, compraria uma casa.",["sou","fosse","for"],1,"If I were rich, I’d buy a house."],["Eu ___ de um café, por favor.",["gosto","gostaria","gostei"],1,"I’d like a coffee, please."],["Se eu ___, eu te falaria.",["sei","soubesse","souber"],1,"If I knew, I’d tell you."],["O que você ___ no meu lugar?",["faz","faria","fará"],1,"What would you do in my place?"],["Se a gente ___ mais tempo…",["tem","tivesse","tiver"],1,"If we had more time…"],["Você ___ me ajudar?",["poderia","pode ser","podia ser"],0,"Could you help me?"]]}
]);

let NOTES=null, NOTESET=null;
function allNotes(){
  if(!NOTES){NOTES=[];NOTESET=new Set();
    const CD=typeof COURSE_DATA!=="undefined"?COURSE_DATA:[];
    const addUnit=(u,ui)=>u.items.forEach((it,ii)=>{NOTESET.add(norm(it[0]));NOTES.push({id:"c"+ui+"-"+ii,pt:it[0],en:it[1],f:it[2]||"",u:u.t});});
    const addTopic=u=>u.items.forEach((it,ii)=>{const k=norm(it[0]);if(NOTESET.has(k))return;NOTESET.add(k);NOTES.push({id:"k:"+u.t+"-"+ii,pt:it[0],en:it[1],f:it[2]||"",u:u.t,l:u.l});});
    UNITS.forEach((u,ui)=>{if(ui<8)addUnit(u,ui);});
    CD.filter(u=>u.party).forEach(addTopic);
    UNITS.forEach((u,ui)=>{if(ui>=8)addUnit(u,ui);});
    CD.filter(u=>!u.party).forEach(addTopic);
    if(!S.idv2){const old=CD.filter(u=>!u.party);Object.keys(S.cards).forEach(k=>{const m=k.match(/^k(\d+)-(\d+)$/);if(m&&old[+m[1]]){S.cards["k:"+old[+m[1]].t+"-"+m[2]]=S.cards[k];delete S.cards[k];}});S.idv2=true;}
  }
  return NOTES.concat(S.ai.filter(n=>!NOTESET.has(norm(n.pt))));
}

let SAMPLE=null, SAMPLE_READY=true;
function setupAI(){SAMPLE=(S.provider==="local"?(S.localUrl&&S.localModel):S.apiKey)?{json:aiJson}:null;}
function parseJSONText(text){
  const clean=text.replace(/```json|```/g,"").trim();
  const m=clean.match(/[\[{][\s\S]*[\]}]/);
  try{return JSON.parse(m?m[0]:clean);}catch(e){throw {code:"bad"};}
}
function aiJson(prompt,opts={}){return S.provider==="local"?localJson(prompt):apiJson(prompt,opts);}
async function localJson(prompt){
  let res;
  try{res=await fetch(S.localUrl.replace(/\/+$/,"")+"/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:S.localModel,stream:false,options:{temperature:0.7},messages:[{role:"user",content:prompt}]})});}
  catch(e){throw {code:"local_down"};}
  if(res.status===404)throw {code:"local_model"};
  if(!res.ok)throw {code:"http",message:String(res.status)};
  const data=await res.json();
  return parseJSONText((data.message&&data.message.content)||"");
}
async function apiJson(prompt,opts={}){
  const model=opts.modelTier==="quick"?"claude-haiku-5-5":"claude-sonnet-5-5";
  let res;
  try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:4000,messages:[{role:"user",content:prompt}]})});}
  catch(e){throw {code:"network"};}
  if(res.status===401||res.status===403)throw {code:"bad_key"};
  if(res.status===429||res.status===529)throw {code:"rate_limited"};
  if(!res.ok)throw {code:"http",message:String(res.status)};
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  const clean=text.replace(/```json|```/g,"").trim();
  const m=clean.match(/[\[{][\s\S]*[\]}]/);
  try{return JSON.parse(m?m[0]:clean);}catch(e){throw {code:"bad"};}
}
setupAI();
function aiError(e){
  const c=e&&e.code;
  if(c==="bad_key")return "Your API key was rejected. Check it in Progresso, Settings.";
  if(c==="local_down")return "Can’t reach your Mac. Check it’s awake, Ollama is running and Tailscale is on.";
  if(c==="local_model")return "Your Mac doesn’t have that model. Check the model name in Progresso.";
  if(c==="bad")return "The reply wasn’t usable. Try again; small local models slip up sometimes.";
  if(c==="network")return "No connection. AI features need internet; everything else works offline.";
  if(c==="rate_limited")return "Too many requests at once. Wait a minute, then try again.";
  return "Claude didn’t answer. Check your connection and try again.";
}

function say(text,o={}){
  return new Promise(res=>{
    if(!("speechSynthesis" in window))return res();
    const lang=o.lang||"pt";const u=new SpeechSynthesisUtterance(text);
    const v=lang==="pt"?ptVoice():enVoice();if(v)u.voice=v;

    let done=false;const fin=()=>{if(!done){done=true;res();}};
    u.onend=fin;u.onerror=fin;setTimeout(fin,text.length*140/u.rate+2500);
    speechSynthesis.speak(u);
  });
}

function fmtIvl(d){return d<1?"<10m":d<30?d+"d":Math.round(d/30)+"mo";}
function nextState(c,r){
  const n=Object.assign({},c);
  if(!n.reps){
    if(r<=2)return {n,requeue:true,label:"<10m"};
    n.reps=1;n.ivl=r===4?4:1;
  }else if(r===1){
    n.lapses=(n.lapses||0)+1;n.ease=Math.max(1.3,n.ease-0.2);n.ivl=1;n.reps+=1;n.due=Date.now();
    return {n,requeue:true,label:"<10m"};
  }else{
    const b=Math.max(1,n.ivl);
    if(r===2){n.ease=Math.max(1.3,n.ease-0.15);n.ivl=Math.max(b+1,Math.round(b*1.2));}
    if(r===3){n.ivl=Math.max(b+1,Math.round(b*n.ease));}
    if(r===4){n.ease+=0.15;n.ivl=Math.max(b+2,Math.round(b*n.ease*1.3));}
    n.reps+=1;
  }
  n.ivl=Math.min(n.ivl,40);n.due=midnight()+n.ivl*DAY+4*3600e3;
  return {n,requeue:false,label:fmtIvl(n.ivl)};
}
function modeFor(c){if(!c||!c.reps||c.reps<2)return "listen";return c.reps%3===0?"audio":"produce";}
function dueNotes(){const now=Date.now();return allNotes().filter(n=>{const c=S.cards[n.id];return c&&c.reps>0&&c.due<=now;}).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);}
function freshLeft(){const l=L();return Math.max(0,S.newPerDay+(l.bonus||0)-l.nw);}
function freshNotes(k){return allNotes().filter(n=>!S.cards[n.id]).slice(0,k);}
function learningNotes(){return allNotes().filter(n=>{const c=S.cards[n.id];return c&&!c.reps;});}

const ST={queue:[],cur:null,revealed:false,typed:"",fb:null,built:false};
function buildQueue(){
  const due=dueNotes().map(n=>n.id), learn=learningNotes().map(n=>n.id), fresh=freshNotes(freshLeft()).map(n=>n.id);
  const nw=learn.concat(fresh);const q=[];let i=0;
  due.forEach((id,k)=>{q.push(id);if((k+1)%3===0&&i<nw.length)q.push(nw[i++]);});
  while(i<nw.length)q.push(nw[i++]);
  ST.queue=q;ST.cur=null;ST.revealed=false;ST.fb=null;ST.built=true;
}
function nextCard(){ST.cur=ST.queue.shift()||null;ST.revealed=false;ST.fb=null;ST.typed="";
  if(ST.cur&&!S.cards[ST.cur]){S.cards[ST.cur]={reps:0,ivl:0,ease:2.5,due:0,lapses:0};L().nw++;saveSoon();}
}

/* answer checking */
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
function strip(s){return s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();}
function check(typed,target){
  if(!typed.trim())return null;
  if(norm(typed)===norm(target))return {ok:true,accents:strip(typed)!==strip(target)};
  const have=new Set(norm(typed).split(" "));
  const words=target.split(/\s+/).map(w=>({w,hit:have.has(norm(w))}));
  return {ok:false,pct:words.filter(x=>x.hit).length/words.length,words};
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeEx(n,type){
  const words=n.pt.split(/\s+/);
  if((type==="tiles"||type==="listenTiles")&&words.length<3)type="say";
  if(type==="blank"){
    const cands=words.map((w,i)=>({w:w.replace(/[^\p{L}\p{N}-]/gu,""),i})).filter(x=>x.w.length>=3);
    if(cands.length){const c=cands[Math.floor(Math.random()*cands.length)];return {type,n,blankIdx:c.i,answer:c.w};}
    type="say";
  }
  if(type==="tiles"||type==="listenTiles"){
    const own=new Set(words.map(norm));
    const pool=[...new Set(shuffle(allNotes().slice(0,700)).slice(0,30).flatMap(o=>o.pt.split(/\s+/)))].filter(w=>!own.has(norm(w)));
    const extra=pool.slice(0,Math.min(4,Math.max(2,Math.round(words.length/3))));
    return {type,n,tiles:shuffle(words.concat(extra)).map(w=>({w})),chosen:[]};
  }
  return {type:"say",n};
}
function makePic(mode){const opts=shuffle(PICS).slice(0,4);return {type:mode,opts,ans:Math.floor(Math.random()*4),pick:-1};}
function startPractice(){
  let pool=allNotes().filter(n=>S.cards[n.id]&&S.cards[n.id].reps>0);
  if(pool.length<8)pool=allNotes().slice(0,40);
  const types=shuffle(["tiles","listenTiles","blank","say","tiles","blank","say","listenTiles","tiles"]);
  const list=shuffle(pool).slice(0,9).map((n,k)=>makeEx(n,types[k]));
  [2,6,10].forEach((pos,k)=>list.splice(pos,0,makePic(k===1?"picHear":"picSee")));
  Object.assign(PR,{on:true,list,i:0,xp:0,right:0,total:0});

}
function loadEx(){

function exAnswer(e){return e.n?e.n.pt:e.opts[e.ans][1];}
function prCheck(){
  const e=PR.ex;if(!e||PR.answered)return;let ok=false;
  const t=$("#prIn");if(t)PR.typed=t.value;
  if(e.type==="tiles"||e.type==="listenTiles")ok=norm(e.chosen.map(i=>e.tiles[i].w).join(" "))===norm(e.n.pt);
  else if(e.type==="blank")ok=norm(PR.typed)===norm(e.answer);
  else if(e.type==="say"){if(!PR.typed.trim())return;const r=check(PR.typed,e.n.pt);e.res=r;ok=!!r&&(r.ok||r.pct>=0.85||(!!e.n.f&&norm(PR.typed)===norm(e.n.f)));}
  else ok=e.pick===e.ans;
  PR.answered=true;PR.ok=ok;PR.total++;
  if(ok){PR.right++;PR.xp+=5;addXP(5);}
  else{
    if(!e.retry)PR.list.push(Object.assign({},e,{retry:true,chosen:[],pick:-1,res:null}));
    if(e.n&&S.cards[e.n.id]&&S.cards[e.n.id].reps>0)S.cards[e.n.id].due=Date.now();
  }
  save();renderStudy();say(exAnswer(e));
}

document.addEventListener("pointerup",e=>{

function doRate(r){

  const res=nextState(c,r);S.cards[id]=res.n;

async function genBatch(topic,lvl,count){
  const existing=new Set(allNotes().map(n=>norm(n.pt)));
  const prompt=`Write ${count} flashcard sentences for a British English speaker learning Brazilian Portuguese. Target level: ${lvl}. Topic: ${topic}.
Write them exactly how a Brazilian in their 20s-30s from São Paulo actually SAYS them to a friend, not textbook Portuguese: cê/você, tá, tô, tava, pra, pro, né, a gente (never nós), tem (never há), pronoun before verb (me ajuda, te ligo), ele/ela as objects, dropped subjects, fillers (tipo, aí, então), reactions, diminutives and common everyday slang where natural. 3 to 12 words each, high-frequency vocabulary, varied grammar suited to ${lvl}, every one usable in a real conversation. Order from simplest to hardest. English: natural casual British English.
For each, "book" is the stiff textbook/formal version if it differs meaningfully, else "".
Return ONLY a JSON array: [{"pt": "...", "en": "...", "book": "..."}]`;
  const arr=await SAMPLE.json(prompt,{modelTier:"default"});
  let added=0;
  if(Array.isArray(arr))arr.forEach((x,i)=>{if(x&&typeof x.pt==="string"&&typeof x.en==="string"&&x.pt.trim()&&!existing.has(norm(x.pt))){S.ai.push({id:"ai"+Date.now().toString(36)+i,pt:x.pt.trim(),en:x.en.trim(),f:(typeof x.book==="string"&&norm(x.book)!==norm(x.pt))?x.book.trim():"",u:topic.slice(0,48)});existing.add(norm(x.pt));added++;}});
  if(!added)throw {code:"empty"};
  return added;
}

async function buildCourse(){
  if(!SAMPLE||CB.running)return;CB.running=true;const tok=++CB.token;S.courseDone=S.courseDone||[];
  for(const [lvl,topic] of COURSE){
    if(tok!==CB.token)break;if(S.courseDone.includes(topic))continue;
    CB.msg=`Writing “${topic}”…`;rerenderCourse();
    try{await genBatch(topic,lvl,25);}catch(e){if(e.code!=="empty"){CB.msg=aiError(e);CB.running=false;save();rerenderCourse();return;}}
    if(tok!==CB.token)break;S.courseDone.push(topic);save();
  }
  if(tok===CB.token){CB.running=false;CB.msg=S.courseDone.length>=COURSE.length?"Done.":"";if(S.courseDone.length>=COURSE.length)toast("Full course ready");}

function startListen(){

  if(!list.length)list=allNotes().slice(0,20);

async function runListen(tok){
  while(LS.on&&tok===LS.token&&LS.i<LS.list.length){
    const t0=Date.now(), n=LS.list[LS.i];LS.cur=n;
    LS.phase="en";renderStudy();await say(n.en,{lang:"en"});if(tok!==LS.token)return;
    LS.phase="think";renderStudy();await wait(3200);if(tok!==LS.token)return;
    LS.phase="pt";renderStudy();await say(n.pt);await wait(800);if(tok!==LS.token)return;await say(n.pt,{rate:S.rate*0.85});await wait(1400);
    if(tok!==LS.token)return;L().sec+=(Date.now()-t0)/1000;addXP(2);LS.i++;

function chatPrompt(){
  const sc=SCENARIOS.find(s=>s.id===CH.scen);
  const tr=CH.turns.slice(-14).map(t=>(t.role==="me"?"Learner: ":"Bia: ")+t.pt).join("\n");
  return `You are Bia, a 28-year-old paulistana chatting with Ezra, a guy from London learning Brazilian Portuguese (level about ${level()}). Your job is to teach him to sound like a real Brazilian, not a textbook.
Scenario: ${sc.p}
How you talk in "reply": exactly like a real Brazilian friend, never textbook. Use cê/você, tá, tô, tava, pra, pro, né, a gente (never nós), tem (never há), pronoun before the verb (me fala, te mando), ele/ela as objects, dropped subjects, fillers (tipo, então, aí, sabe?, pô), reactions (nossa, sério?, jura?, pois é, putz, que massa, caramba), diminutives (rapidinho, pertinho) and everyday slang (beleza, de boa, rolar, fechou, cara, mano) where it fits. Keep it 1 to 3 short sentences pitched to his level, usually ending with a question. Stay in character. If he seems stuck, rephrase more simply. ${CH.scen==="zap"?"This is WhatsApp texting: lowercase, abbreviations like vc, tb, pq, blz, msm, kkkk.":""}

${tr||"(nothing yet: open the conversation casually)"}

async function askBia(){

    <div class="setting"><span>Portuguese voice</span><select data-set="voice"><option value="">Automatic</option>${pv.map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select></div>
    <div class="setting"><span>AI for Bia and extras</span><select data-set="provider"><option value="anthropic" ${S.provider!=="local"?"selected":""}>Claude (API key)</option><option value="local" ${S.provider==="local"?"selected":""}>My Mac (Ollama)</option></select></div>
    ${S.provider==="local"?`<div class="setting" style="flex-wrap:wrap"><span>Mac address</span><input class="text" id="localurl" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://your-mac.tailnet.ts.net" value="${esc(S.localUrl)}" style="flex:1;min-width:200px;padding:8px 10px"></div>
    <div class="setting" style="flex-wrap:wrap"><span>Model</span><span class="row" style="flex:1;min-width:200px"><input class="text" id="localmodel" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. gemma3:12b" value="${esc(S.localModel)}" style="padding:8px 10px"><button class="chip" data-act="saveLocal">Save</button><button class="chip" data-act="testLocal">Test</button></span></div>`
    :`<div class="setting" style="flex-wrap:wrap"><span>Anthropic API key</span><span class="row" style="flex:1;min-width:200px"><input class="text" id="apikey" type="password" autocomplete="off" placeholder="${S.apiKey?"Saved. Paste to replace":"sk-ant-…"}" style="padding:8px 10px"><button class="chip" data-act="saveKey">Save</button>${S.apiKey?`<button class="chip" data-act="clearKey">Remove</button>`:""}</span></div>`}
    <div class="setting"><span>Theme</span><select data-set="theme">${[["auto","Match phone"],["light","Light"],["dark","Dark"]].map(([x,t])=>`<option value="${x}" ${S.theme===x?"selected":""}>${t}</option>`).join("")}</select></div>
  </div>
  <p class="note">${S.provider==="local"?"Bia runs on your Mac: free, but it needs your Mac awake and online, and replies are less natural than Claude’s.":"Your key stays on this phone only."} It isn’t in the app’s code, the link or backups. ${esc(SYNC)}. ${pv.length?"":"No Brazilian voice found on this device; install one in your phone’s text-to-speech settings."}</p>
  <h2 class="section-title">Course</h2>
  ${courseHTML()}
  <h2 class="section-title">Backup</h2>
  <div class="row" style="flex-wrap:wrap"><button class="btn quiet" data-act="export">Copy backup</button><button class="btn quiet" data-act="importShow">Restore backup</button><button class="btn quiet" data-act="reset">Reset all</button></div>
  <div id="bk"></div>`;
}
function fmtD(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});}

/* ================= NAV & EVENTS ================= */
function showView(name){
  if(VIEW!==name){hush();if(LS.on&&name!=="study"){LS.on=false;LS.token++;}if(SH.playing){SH.playing=false;SH.token++;}if(REC){try{REC.stop();}catch(e){}}}
  VIEW=name;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+name));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));
  if(name==="study"&&!ST.cur&&!LS.on)ST.built=false;
  rerender();if(!(name==="speak"&&CH.scen))window.scrollTo(0,0);
}
function rerender(){({today:renderToday,study:renderStudy,speak:renderSpeak,grammar:renderGrammar,progress:renderProgress})[VIEW]();}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)showView(b.dataset.tab);});

const A={
  go:b=>showView(b.dataset.to),
  goSpeak:b=>{SP.mode=b.dataset.mode;showView("speak");},
  imm:b=>{const m=Number(b.dataset.m);L().imm+=m;addXP(m);save();renderToday();toast(`Immersion logged, +${m} XP`);},
  handsfree:()=>startListen(),
  mission:()=>{if(MISSION)MISSION.go();},
  practice:()=>startPractice(),
  prExit:()=>{PR.on=false;hush();renderStudy();},
  prCheck:()=>prCheck(),
  prPlay:()=>{if(PR.ex)say(exAnswer(PR.ex));},
  prNext:()=>{PR.i++;if(PR.i>=PR.list.length){L().active=(L().active||0)+1;addXP(15);save();}loadEx();renderStudy();window.scrollTo(0,0);},
  picPick:b=>{if(PR.answered)return;PR.ex.pick=+b.dataset.k;prCheck();},
  tile:b=>{if(PR.justDragged||PR.answered)return;const i=+b.dataset.i,ex=PR.ex;if(b.dataset.zone==="bank"){if(!ex.chosen.includes(i))ex.chosen.push(i);}else ex.chosen=ex.chosen.filter(x=>x!==i);renderStudy();},
  micPr:()=>startMic(t=>{const i=$("#prIn");if(i){i.value=t;PR.typed=t;}}),
  celeClose:()=>{$("#celehost").innerHTML="";},
  course:()=>{CB.running?stopCourse():buildCourse();},
  listenStop:()=>stopListen(),
  play:()=>{const n=noteById(ST.cur);if(n)say(n.pt);},
  reveal:()=>doReveal(),
  rate:b=>doRate(Number(b.dataset.r)),
  accent:b=>{const t=$("#typed")||$("#prIn");if(!t)return;const s=t.selectionStart??t.value.length,e=t.selectionEnd??s;t.value=t.value.slice(0,s)+b.dataset.ch+t.value.slice(e);ST.typed=t.value;PR.typed=t.value;t.focus();t.setSelectionRange(s+1,s+1);},
  micCard:()=>startMic(txt=>{const t=$("#typed");if(t){t.value=txt;ST.typed=txt;}}),
  more:()=>{L().bonus=(L().bonus||0)+10;save();ST.built=false;renderStudy();},
  topic:b=>{const t=$("#topic");if(t)t.value=b.dataset.t;genCards(b.dataset.t);},
  gen:()=>{const t=$("#topic");if(t&&t.value.trim())genCards(t.value.trim());},
  spMode:b=>{hush();if(SH.playing){SH.playing=false;SH.token++;}SP.mode=b.dataset.m;renderSpeak();},
  scen:b=>{CH.scen=b.dataset.id;CH.turns=[];CH.showEn={};askBia();},
  scenBack:()=>{CH.scen=null;hush();renderSpeak();},
  send:()=>sendChat(),
  micChat:()=>startMic(txt=>{const i=$("#chatin");if(i)i.value=txt;}),
  chatPlay:b=>say(CH.turns[b.dataset.i].pt),
  chatEn:b=>{CH.showEn[b.dataset.i]=!CH.showEn[b.dataset.i];renderSpeak();},
  chatSave:b=>{const t=CH.turns[b.dataset.i];if(!t||!t.corr||t.saved)return;S.ai.push({id:"ai"+Date.now().toString(36),pt:t.corr.fixed,en:t.corr.en||t.pt,u:"From conversation"});t.saved=true;save();toast("Added to your deck");renderSpeak();},
  shOpen:b=>{SH.d=Number(b.dataset.i);SH.i=-1;renderSpeak();},
  shBack:()=>{SH.token++;SH.playing=false;hush();SH.d=null;renderSpeak();},
  shPlay:()=>{if(SH.playing){SH.playing=false;SH.token++;hush();renderSpeak();return;}SH.playing=true;SH.token++;renderSpeak();shadowPlay(SH.token);},
  shSlow:()=>{SH.slow=!SH.slow;renderSpeak();},
  shEn:()=>{SH.showEn=!SH.showEn;renderSpeak();},
  shLine:b=>{SH.token++;SH.playing=false;hush();SH.i=Number(b.dataset.i);renderSpeak();say(DIALOGUES[SH.d].l[SH.i][0],{rate:SH.slow?0.72:S.rate});},
  sound:b=>say(SOUNDS[b.dataset.i][0].replace(/ vs /g,", "),{rate:0.8}),
  qzNext:()=>qzNext(),
  qzReplay:()=>{if(QZ.pair)say(QZ.pair[QZ.ans],{rate:0.85});},
  qzPick:b=>{if(QZ.pick>=0)return;QZ.pick=Number(b.dataset.k);QZ.n++;if(QZ.pick===QZ.ans)QZ.score++;renderSpeak();},
  grOpen:b=>{GR.u=Number(b.dataset.i);GR.list=null;renderGrammar();window.scrollTo(0,0);},
  grBack:()=>{GR.u=null;GR.list=null;renderGrammar();},
  grRule:()=>{GR.list=null;renderGrammar();},
  grStart:()=>{const g=GRAMMAR[GR.u];GR.list=g.d.map(q=>{const o=q[1].map((x,k)=>({x,k})).sort(()=>Math.random()-.5);return [q[0],o.map(y=>y.x),o.findIndex(y=>y.k===q[2]),q[3]];}).sort(()=>Math.random()-.5);GR.i=0;GR.score=0;GR.pick=-1;renderGrammar();},
  grAI:()=>grAI(),
  grPick:b=>{const q=GR.list[GR.i];GR.pick=Number(b.dataset.k);if(GR.pick===q[2])GR.score++;renderGrammar();say(q[0].includes("___")?q[0].replace("___",q[1][q[2]]).replace(/\s*\(.*?\)\s*$/,"").replace(/[“”]/g,""):q[1][q[2]]);},
  grNext:()=>{GR.i++;GR.pick=-1;if(GR.i>=GR.list.length){const g=GRAMMAR[GR.u];const pct=GR.score/GR.list.length;S.gram[g.id]=Math.max(S.gram[g.id]||0,pct);L().gram++;addXP(20+GR.score*5);save();}renderGrammar();},
  export:async()=>{const txt=JSON.stringify(Object.assign({},S,{apiKey:""}));try{await navigator.clipboard.writeText(txt);toast("Backup copied. Paste it somewhere safe.");}catch(e){$("#bk").innerHTML=`<p class="note">Copy all of this text:</p><textarea class="text" readonly>${esc(txt)}</textarea>`;}},
  importShow:()=>{$("#bk").innerHTML=`<p class="note">Paste a backup, then restore. This replaces current progress.</p><textarea class="text" id="imp"></textarea><button class="btn" style="margin-top:8px" data-act="import">Restore</button>`;},
  import:()=>{try{const d=JSON.parse($("#imp").value);if(!d||!d.v)throw 0;const k=S.apiKey;S=Object.assign(defaults(),d);S.apiKey=k;setupAI();save();applyTheme();ST.built=false;toast("Backup restored");renderProgress();}catch(e){toast("That text isn’t a Fala backup.");}},
  saveKey:()=>{const v=($("#apikey").value||"").trim();if(!v){toast("Paste a key first.");return;}S.apiKey=v;setupAI();save();toast("Key saved on this phone");renderProgress();},
  saveLocal:()=>{S.localUrl=($("#localurl").value||"").trim();S.localModel=($("#localmodel").value||"").trim();setupAI();save();toast(S.localUrl&&S.localModel?"Mac settings saved":"Add both the address and the model");renderProgress();},
  testLocal:async()=>{const u=($("#localurl").value||"").trim().replace(/\/+$/,"");if(!u){toast("Add your Mac’s address first.");return;}
    try{const r=await fetch(u+"/api/tags");const d=await r.json();const names=(d.models||[]).map(m=>m.name);const want=($("#localmodel").value||"").trim();
      toast(names.length?(want&&!names.includes(want)&&!names.some(n=>n.startsWith(want+":"))?`Connected, but no “${want}”. You have: ${names.slice(0,3).join(", ")}`:`Connected. ${names.length} model${names.length===1?"":"s"} on your Mac.`):"Connected, but no models installed yet.");}
    catch(e){toast("Can’t reach your Mac. Check Ollama, Tailscale and the address.");}},
  clearKey:()=>{S.apiKey="";setupAI();save();toast("Key removed");renderProgress();},
  reset:()=>{if(confirm("Delete all progress? This can’t be undone.")){const k=S.apiKey;S=defaults();S.apiKey=k;save();ST.built=false;ST.cur=null;applyTheme();toast("Progress reset");renderProgress();}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b,e);});
document.addEventListener("change",e=>{const el=e.target.closest("[data-set]");if(!el)return;const k=el.dataset.set;
  if(k==="autoplay")S.autoplay=el.checked;
  else if(k==="voice"||k==="theme"||k==="provider")S[k]=el.value;
  else S[k]=Number(el.value);
  if(k==="theme")applyTheme();
  if(k==="provider"){setupAI();renderProgress();}
  if(k==="newPerDay")ST.built=false;
  save();if(k==="voice")say("Olá! Essa é a minha voz.");});
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
renderToday();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
